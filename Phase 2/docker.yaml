services:
  redis:
    image: redis:7-alpine
    container_name: wordcount-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  wordcount:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordcount-rpc
    cpus: 0.1
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RPC_PORT: 18812
      CACHE_TTL_SECONDS: 3600
    ports:
      - "18812:18812"
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wordcount-client
    depends_on:
      - wordcount
    environment:
      RPC_HOST: wordcount
      RPC_PORT: 18812
    command: python /app/client.py
    profiles: ["tools"]
